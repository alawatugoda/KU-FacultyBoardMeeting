<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLIIT Kandy UNI – Overtime Claim System</title>
<style>
  :root {
    --primary: #1a3c6e;
    --accent: #e63946;
    --bg: #f5f7fa;
    --card: #ffffff;
    --border: #dde3ed;
    --text: #1f2937;
    --muted: #6b7280;
    --success: #16a34a;
    --warning: #d97706;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  nav {
    background: var(--primary); color: white;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; height: 56px; position: sticky; top: 0; z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .nav-brand { font-size: 1.1rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .nav-links { display: flex; gap: 4px; }
  .nav-btn { background: transparent; border: none; color: white; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.88rem; transition: background 0.2s; }
  .nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,0.18); }
  .nav-user { font-size: 0.82rem; opacity: 0.85; display: flex; align-items: center; gap: 8px; }
  .badge { background: var(--accent); border-radius: 10px; padding: 2px 8px; font-size: 0.75rem; }

  .container { max-width: 900px; margin: 0 auto; padding: 28px 16px; }
  .page { display: none; }
  .page.active { display: block; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .card-title { font-size: 1.05rem; font-weight: 600; color: var(--primary); margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }

  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.85rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  input, select, textarea { border: 1.5px solid var(--border); border-radius: 8px; padding: 9px 12px; font-size: 0.95rem; background: var(--bg); transition: border-color 0.2s; font-family: inherit; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--primary); background: white; }
  textarea { resize: vertical; min-height: 70px; }
  .radio-group { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .radio-btn { display: flex; align-items: center; gap: 6px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 8px; padding: 7px 14px; cursor: pointer; font-size: 0.9rem; transition: all 0.15s; }
  .radio-btn input[type="radio"] { accent-color: var(--primary); }
  .radio-btn:has(input:checked) { background: #e8f0fb; border-color: var(--primary); color: var(--primary); font-weight: 600; }

  .btn-row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 8px; flex-wrap: wrap; }
  .btn { border: none; border-radius: 8px; padding: 9px 20px; font-size: 0.93rem; font-weight: 600; cursor: pointer; transition: all 0.18s; }
  .btn-primary { background: var(--primary); color: white; }
  .btn-primary:hover { background: #15336a; transform: translateY(-1px); }
  .btn-secondary { background: var(--bg); border: 1.5px solid var(--border); color: var(--text); }
  .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
  .btn-danger { background: var(--accent); color: white; }
  .btn-danger:hover { background: #c1121f; }
  .btn-success { background: var(--success); color: white; }
  .btn-sm { padding: 5px 12px; font-size: 0.8rem; }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { background: #f0f4fb; color: var(--primary); font-weight: 700; padding: 10px 12px; text-align: left; border-bottom: 2px solid var(--border); }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8f9fb; }

  .chip { display: inline-block; border-radius: 20px; padding: 3px 10px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .chip-pending { background: #fef3c7; color: #92400e; }
  .chip-approved { background: #dcfce7; color: #166534; }

  .alert { border-radius: 8px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
  .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
  .alert-warn { background: #fef9c3; color: #854d0e; border: 1px solid #fef08a; }
  .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

  .month-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat { flex: 1; min-width: 120px; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px 18px; }
  .stat-val { font-size: 1.6rem; font-weight: 800; color: var(--primary); }
  .stat-label { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }

  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: white; border-radius: 14px; padding: 28px; max-width: 480px; width: 94%; max-height: 90vh; overflow-y: auto; }
  .modal-title { font-size: 1.1rem; font-weight: 700; color: var(--primary); margin-bottom: 18px; }

  /* LOGIN */
  #loginPage { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box { background: white; border-radius: 16px; padding: 40px 36px; width: 100%; max-width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.1); }
  .login-logo { text-align: center; margin-bottom: 24px; }
  .login-logo h1 { font-size: 1.3rem; color: var(--primary); font-weight: 800; }
  .login-logo p { font-size: 0.82rem; color: var(--muted); }
  .login-tabs { display: flex; border: 1.5px solid var(--border); border-radius: 8px; overflow: hidden; margin-bottom: 20px; }
  .login-tab { flex: 1; padding: 8px; text-align: center; cursor: pointer; font-size: 0.85rem; font-weight: 600; border: none; background: var(--bg); color: var(--muted); transition: all 0.15s; }
  .login-tab.active { background: var(--primary); color: white; }
  .pw-wrap { position: relative; }
  .pw-wrap input { width: 100%; padding-right: 40px; }
  .pw-eye { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 1rem; border: none; background: none; color: var(--muted); }

  @media (max-width: 600px) {
    .form-grid { grid-template-columns: 1fr; }
    .stat { min-width: 90px; }
    nav { padding: 0 12px; }
  }
</style>
</head>
<body>

<!-- ══ LOGIN ══ -->
<div id="loginPage">
  <div class="login-box">
    <div class="login-logo">
      <span style="font-size:2.5rem">🎓</span>
      <h1>SLIIT Kandy UNI</h1>
      <p>After-Hours Overtime Claim System</p>
    </div>
    <div class="login-tabs">
      <button class="login-tab active" onclick="setLoginRole('instructor')">Instructor</button>
      <button class="login-tab" onclick="setLoginRole('admin')">Admin / HR</button>
    </div>

    <!-- Instructor login -->
    <div id="instructorLoginForm">
      <div class="form-group" style="margin-bottom:16px">
        <label>Select Instructor</label>
        <select id="loginUser"></select>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="doInstructorLogin()">Sign In →</button>
    </div>

    <!-- Admin login -->
    <div id="adminLoginForm" style="display:none">
      <div class="form-group" style="margin-bottom:12px">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" id="adminPw" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')doAdminLogin()">
          <button class="pw-eye" onclick="togglePw()">👁</button>
        </div>
      </div>
      <div id="loginError" style="display:none" class="alert alert-error" style="margin-bottom:10px">Incorrect password.</div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doAdminLogin()">Sign In →</button>
    </div>
    <p style="text-align:center; margin-top:12px; font-size:0.78rem; color:var(--muted)">SLIIT Kandy UNI · Kengolla, Kundasale</p>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="app" style="display:none">
  <nav>
    <div class="nav-brand">🎓 SLIIT Kandy UNI – OT Claims</div>
    <div class="nav-links">
      <button class="nav-btn active" id="navClaim" onclick="showPage('claim')">New Claim</button>
      <button class="nav-btn" id="navHistory" onclick="showPage('history')">My Claims</button>
      <button class="nav-btn" id="navAdmin" onclick="showPage('admin')" style="display:none">Admin</button>
    </div>
    <div class="nav-user">
      <span id="navName"></span>
      <span class="badge" id="navDept"></span>
      <button class="nav-btn" onclick="doLogout()" style="font-size:0.78rem;padding:4px 10px">Sign out</button>
    </div>
  </nav>

  <!-- ── CLAIM PAGE ── -->
  <div id="claimPage" class="page active">
    <div class="container">
      <div id="claimAlert" style="display:none"></div>
      <div class="card">
        <div class="card-title">📋 Submit After-Hours Overtime Claim</div>
        <div class="form-grid">
          <div class="form-group">
            <label>Month</label>
            <select id="claimMonth">
              <option value="1">January</option><option value="2">February</option>
              <option value="3">March</option><option value="4">April</option>
              <option value="5">May</option><option value="6">June</option>
              <option value="7">July</option><option value="8">August</option>
              <option value="9">September</option><option value="10">October</option>
              <option value="11">November</option><option value="12">December</option>
            </select>
          </div>
          <div class="form-group">
            <label>Year</label>
            <select id="claimYear"></select>
          </div>
          <div class="form-group">
            <label>Day of Week</label>
            <select id="claimDay">
              <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
              <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
            </select>
          </div>
          <div class="form-group">
            <label>Date</label>
            <input type="date" id="claimDate">
          </div>
          <div class="form-group">
            <label>Start Time</label>
            <input type="time" id="claimStart">
          </div>
          <div class="form-group">
            <label>End Time</label>
            <input type="time" id="claimEnd">
          </div>
          <div class="form-group full">
            <label>Reason Category</label>
            <div class="radio-group">
              <label class="radio-btn"><input type="radio" name="reason" value="Lecture Reschedule" onclick="onReasonChange(this)"> Lecture Reschedule</label>
              <label class="radio-btn"><input type="radio" name="reason" value="Online Session" onclick="onReasonChange(this)"> Online Session</label>
              <label class="radio-btn"><input type="radio" name="reason" value="Other" onclick="onReasonChange(this)"> Other</label>
            </div>
          </div>
          <div class="form-group full" id="moduleGroup" style="display:none">
            <label>Module Code</label>
            <input type="text" id="claimModule" placeholder="e.g. IS4101, CS3202">
          </div>
          <div class="form-group full" id="otherReasonGroup" style="display:none">
            <label>Brief Description</label>
            <textarea id="claimOtherReason" placeholder="Describe the reason briefly..."></textarea>
          </div>
        </div>
        <div class="btn-row" style="margin-top:20px">
          <button class="btn btn-secondary" onclick="clearForm()">Clear</button>
          <button class="btn btn-secondary" onclick="saveJSON()">💾 Save as JSON</button>
          <button class="btn btn-secondary" onclick="loadJSON()">📂 Load JSON</button>
          <button class="btn btn-primary" onclick="submitClaim()">Submit Claim →</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── HISTORY PAGE ── -->
  <div id="historyPage" class="page">
    <div class="container">
      <div class="month-bar">
        <strong>Filter:</strong>
        <select id="filterMonth">
          <option value="0">All Months</option>
          <option value="1">January</option><option value="2">February</option>
          <option value="3">March</option><option value="4">April</option>
          <option value="5">May</option><option value="6">June</option>
          <option value="7">July</option><option value="8">August</option>
          <option value="9">September</option><option value="10">October</option>
          <option value="11">November</option><option value="12">December</option>
        </select>
        <select id="filterYear"></select>
      </div>
      <div class="stat-row" id="statRow"></div>
      <div class="card">
        <div class="card-title">🗂️ My Overtime Claims</div>
        <div class="table-wrap"><div id="historyTable"></div></div>
      </div>
    </div>
  </div>

  <!-- ── ADMIN PAGE ── -->
  <div id="adminPage" class="page">
    <div class="container">
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px">
        <button class="btn btn-primary" id="tabClaimsBtn" onclick="adminTab('claims')">All Claims</button>
        <button class="btn btn-secondary" id="tabInstrBtn" onclick="adminTab('instructors')">Manage Instructors</button>
      </div>

      <div id="adminClaims">
        <div class="card">
          <div class="card-title">📊 All Submitted Claims</div>
          <div class="month-bar">
            <select id="adminFilterMonth">
              <option value="0">All Months</option>
              <option value="1">January</option><option value="2">February</option>
              <option value="3">March</option><option value="4">April</option>
              <option value="5">May</option><option value="6">June</option>
              <option value="7">July</option><option value="8">August</option>
              <option value="9">September</option><option value="10">October</option>
              <option value="11">November</option><option value="12">December</option>
            </select>
            <select id="adminFilterDept">
              <option value="">All Departments</option>
              <option value="Department of Computing">Dept. of Computing</option>
              <option value="Department of Business Management">Dept. of Business Management</option>
            </select>
            <button class="btn btn-primary btn-sm" onclick="renderAdminClaims()">Filter</button>
            <button class="btn btn-success btn-sm" onclick="sendMonthlyReport()">📧 Monthly Report</button>
          </div>
          <div class="table-wrap"><div id="adminClaimsTable"></div></div>
        </div>
      </div>

      <div id="adminInstructors" style="display:none">
        <div class="card">
          <div class="card-title">👤 Manage Instructors</div>
          <div class="form-grid" style="max-width:560px">
            <div class="form-group">
              <label>Full Name</label>
              <input type="text" id="newName" placeholder="Name">
            </div>
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="newEmail" placeholder="name@kandyuni.lk">
            </div>
            <div class="form-group full">
              <label>Department</label>
              <select id="newDept">
                <option value="Department of Computing">Department of Computing</option>
                <option value="Department of Business Management">Department of Business Management</option>
              </select>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-primary" onclick="addInstructor()">+ Add Instructor</button>
          </div>
          <hr style="margin:20px 0;border:none;border-top:1px solid var(--border)">
          <div id="instructorList"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Email Modal -->
<div class="modal-overlay" id="emailModal">
  <div class="modal">
    <div class="modal-title">📧 Email Preview</div>
    <div id="emailPreview" style="font-size:0.85rem;white-space:pre-wrap;background:#f8f9fb;border-radius:8px;padding:14px;border:1px solid var(--border);max-height:60vh;overflow-y:auto;font-family:monospace;"></div>
    <div class="btn-row" style="margin-top:16px">
      <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" onclick="copyEmail()">📋 Copy</button>
    </div>
  </div>
</div>

<input type="file" id="jsonFileInput" accept=".json" style="display:none" onchange="onJSONFile(event)">

<script>
// ══════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════
const ADMIN_PASSWORD = 'abc123';
const HR_EMAIL       = 'nadeeshani.m@kandyuni.lk';
const HOD_COMPUTING  = 'janaka.a@kandyuni.lk';
const HOD_BUSINESS   = 'sujeewa.k@kandyuni.lk';
const PHONE          = '081 754 4888';

const KEY_INSTRUCTORS = 'ot_instructors';
const KEY_CLAIMS      = 'ot_claims';

const MONTH_NAMES = ['','January','February','March','April','May','June','July','August','September','October','November','December'];

// ══════════════════════════════════════════
//  DEFAULT INSTRUCTOR DATA (from instructors.json)
// ══════════════════════════════════════════
const DEFAULT_INSTRUCTORS = [
  { id:'i1',  name:'Chamod Kodithuwakku',      email:'chamod.k@kandyuni.lk',     dept:'Department of Computing',          role:'instructor' },
  { id:'i2',  name:'Rashmika Perera',           email:'rashmika.p@kandyuni.lk',   dept:'Department of Computing',          role:'instructor' },
  { id:'i3',  name:'Vihangie Yasuththara',      email:'vihangie.y@kandyuni.lk',   dept:'Department of Computing',          role:'instructor' },
  { id:'i4',  name:'Sanduni Rathnapriya',       email:'sanduni.r@kandyuni.lk',    dept:'Department of Computing',          role:'instructor' },
  { id:'i5',  name:'Wayangi Kalupahana',        email:'wayangi.k@kandyuni.lk',    dept:'Department of Computing',          role:'instructor' },
  { id:'i6',  name:'Oshadi Senevirathna',       email:'oshadi.s@kandyuni.lk',     dept:'Department of Computing',          role:'instructor' },
  { id:'i7',  name:'Anjali Kiriella',           email:'anjali.k@kandyuni.lk',     dept:'Department of Computing',          role:'instructor' },
  { id:'i8',  name:'Hiroshika Marassana',       email:'hiroshika.m@kandyuni.lk',  dept:'Department of Computing',          role:'instructor' },
  { id:'i9',  name:'Sonali Jayarathne',         email:'sonali.j@kandyuni.lk',     dept:'Department of Computing',          role:'instructor' },
  { id:'i10', name:'Sawbhaggya Bandara',        email:'sawbhaggya.b@kandyuni.lk', dept:'Department of Computing',          role:'instructor' },
  { id:'i11', name:'Umesha Vihangi Rathnayake', email:'umesha.r@kandyuni.lk',     dept:'Department of Computing',          role:'instructor' },
  { id:'i12', name:'Ayodya Herath',             email:'ayodya.h@kandyuni.lk',     dept:'Department of Computing',          role:'instructor' },
  { id:'i13', name:'Maheshi Jayasinghe',        email:'maheshi.j@kandyuni.lk',    dept:'Department of Computing',          role:'instructor' },
  { id:'i14', name:'Dilmi Dehigolla',           email:'dilmi.d@kandyuni.lk',      dept:'Department of Computing',          role:'instructor' },
  { id:'i15', name:'Kavindya Wijethilake',      email:'kavindya.w@kandyuni.lk',   dept:'Department of Computing',          role:'instructor' },
  { id:'i16', name:'Imashi Fonseka',            email:'imashi.f@kandyuni.lk',     dept:'Department of Computing',          role:'instructor' },
  { id:'i17', name:'Sasanka Ranasinghe',        email:'sasanka.r@kandyuni.lk',    dept:'Department of Business Management',role:'instructor' },
];

// ══════════════════════════════════════════
//  STORAGE
// ══════════════════════════════════════════
function getInstructors() {
  try { return JSON.parse(localStorage.getItem(KEY_INSTRUCTORS)) || DEFAULT_INSTRUCTORS.slice(); }
  catch { return DEFAULT_INSTRUCTORS.slice(); }
}
function saveInstructors(d) { localStorage.setItem(KEY_INSTRUCTORS, JSON.stringify(d)); }
function getClaims() {
  try { return JSON.parse(localStorage.getItem(KEY_CLAIMS)) || []; }
  catch { return []; }
}
function saveClaims(d) { localStorage.setItem(KEY_CLAIMS, JSON.stringify(d)); }

// ══════════════════════════════════════════
//  LOGIN
// ══════════════════════════════════════════
let loginRole = 'instructor';
let currentUser = null;

function setLoginRole(role) {
  loginRole = role;
  document.querySelectorAll('.login-tab').forEach((t,i) => t.classList.toggle('active', (i===0&&role==='instructor')||(i===1&&role==='admin')));
  document.getElementById('instructorLoginForm').style.display = role==='instructor' ? 'block' : 'none';
  document.getElementById('adminLoginForm').style.display      = role==='admin'      ? 'block' : 'none';
  document.getElementById('loginError').style.display = 'none';
  if (role==='instructor') populateLoginUsers();
}

function populateLoginUsers() {
  const sel = document.getElementById('loginUser');
  sel.innerHTML = '';
  getInstructors().forEach(u => sel.innerHTML += `<option value="${u.id}">${u.name} — ${u.dept.replace('Department of ','')}</option>`);
}

function doInstructorLogin() {
  const id = document.getElementById('loginUser').value;
  const user = getInstructors().find(u => u.id === id);
  if (user) launchApp(user);
}

function doAdminLogin() {
  const pw = document.getElementById('adminPw').value;
  if (pw !== ADMIN_PASSWORD) {
    document.getElementById('loginError').style.display = 'flex';
    document.getElementById('adminPw').focus();
    return;
  }
  launchApp({ id:'admin', name:'Admin / HR', email: HR_EMAIL, dept:'HR', role:'admin' });
}

function togglePw() {
  const el = document.getElementById('adminPw');
  el.type = el.type === 'password' ? 'text' : 'password';
}

function launchApp(user) {
  currentUser = user;
  document.getElementById('loginPage').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('adminPw').value = '';
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('navName').textContent = user.name;
  document.getElementById('navDept').textContent = user.role==='admin' ? 'HR / Admin' : user.dept.replace('Department of ','');
  const isAdmin = user.role === 'admin';
  document.getElementById('navAdmin').style.display   = isAdmin ? 'inline-block' : 'none';
  document.getElementById('navClaim').style.display   = isAdmin ? 'none' : 'inline-block';
  document.getElementById('navHistory').style.display = isAdmin ? 'none' : 'inline-block';
  initYearSelects();
  if (isAdmin) { showPage('admin'); renderAdminClaims(); renderInstructorList(); }
  else { showPage('claim'); renderHistory(); }
}

function doLogout() {
  currentUser = null;
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginPage').style.display = 'flex';
  setLoginRole('instructor');
}

// ══════════════════════════════════════════
//  PAGES
// ══════════════════════════════════════════
function showPage(p) {
  ['claim','history','admin'].forEach(x => {
    document.getElementById(x+'Page').classList.toggle('active', x===p);
    const btn = document.getElementById('nav'+x.charAt(0).toUpperCase()+x.slice(1));
    if (btn) btn.classList.toggle('active', x===p);
  });
  if (p==='history') renderHistory();
  if (p==='admin')   { renderAdminClaims(); renderInstructorList(); }
}

function adminTab(t) {
  document.getElementById('adminClaims').style.display      = t==='claims'      ? 'block' : 'none';
  document.getElementById('adminInstructors').style.display = t==='instructors' ? 'block' : 'none';
  document.getElementById('tabClaimsBtn').className  = 'btn ' + (t==='claims'      ? 'btn-primary' : 'btn-secondary');
  document.getElementById('tabInstrBtn').className   = 'btn ' + (t==='instructors' ? 'btn-primary' : 'btn-secondary');
}

// ══════════════════════════════════════════
//  YEAR SELECTS
// ══════════════════════════════════════════
function initYearSelects() {
  const y = new Date().getFullYear();
  ['claimYear','filterYear','adminFilterYear'].forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    el.innerHTML = '';
    for (let i=y; i>=y-2; i--) el.innerHTML += `<option value="${i}">${i}</option>`;
  });
  document.getElementById('claimMonth').value  = new Date().getMonth()+1;
  document.getElementById('filterMonth').value = new Date().getMonth()+1;
  document.getElementById('adminFilterMonth').value = new Date().getMonth()+1;
}

// ══════════════════════════════════════════
//  CLAIM FORM
// ══════════════════════════════════════════
function onReasonChange(el) {
  document.getElementById('moduleGroup').style.display      = (el.value==='Lecture Reschedule'||el.value==='Online Session') ? 'flex' : 'none';
  document.getElementById('otherReasonGroup').style.display = el.value==='Other' ? 'flex' : 'none';
}

function clearForm() {
  ['claimDate','claimStart','claimEnd','claimModule','claimOtherReason'].forEach(id => document.getElementById(id).value = '');
  document.querySelectorAll('input[name="reason"]').forEach(r => r.checked = false);
  document.getElementById('moduleGroup').style.display = 'none';
  document.getElementById('otherReasonGroup').style.display = 'none';
}

function getFormData() {
  const reason = document.querySelector('input[name="reason"]:checked');
  if (!document.getElementById('claimDate').value)  { alert('Please select a date'); return null; }
  if (!document.getElementById('claimStart').value || !document.getElementById('claimEnd').value) { alert('Please fill in start and end time'); return null; }
  if (!reason) { alert('Please select a reason category'); return null; }
  if ((reason.value==='Lecture Reschedule'||reason.value==='Online Session') && !document.getElementById('claimModule').value.trim()) { alert('Please enter the module code'); return null; }
  if (reason.value==='Other' && !document.getElementById('claimOtherReason').value.trim()) { alert('Please describe the reason'); return null; }
  return {
    id: Date.now().toString(),
    instructorId: currentUser.id, instructorName: currentUser.name,
    instructorEmail: currentUser.email, dept: currentUser.dept,
    month: parseInt(document.getElementById('claimMonth').value),
    year:  parseInt(document.getElementById('claimYear').value),
    day:   document.getElementById('claimDay').value,
    date:  document.getElementById('claimDate').value,
    startTime: document.getElementById('claimStart').value,
    endTime:   document.getElementById('claimEnd').value,
    reason:    reason.value,
    moduleCode:  document.getElementById('claimModule').value.trim(),
    otherReason: document.getElementById('claimOtherReason').value.trim(),
    status: 'Pending',
    submittedAt: new Date().toISOString()
  };
}

function submitClaim() {
  const data = getFormData(); if (!data) return;
  const claims = getClaims(); claims.push(data); saveClaims(claims);
  const deptEmail = data.dept === 'Department of Computing' ? HOD_COMPUTING : HOD_BUSINESS;
  showEmailPreview(buildEmail(data, HR_EMAIL, deptEmail));
  showAlert('claimAlert', '✅ Claim submitted! Email preview ready — copy and send to HR & Department Head.', 'success');
  clearForm();
  setTimeout(() => document.getElementById('claimAlert').style.display = 'none', 6000);
}

function buildEmail(c, hrEmail, deptEmail) {
  const reason = c.reason === 'Other'
    ? `Other — ${c.otherReason}`
    : c.moduleCode ? `${c.reason} (Module: ${c.moduleCode})` : c.reason;
  const hrs = calcHours(c.startTime, c.endTime).toFixed(1);
  return `TO: ${hrEmail}, ${deptEmail}
FROM: ${c.instructorEmail}
SUBJECT: After-Hours Overtime Claim — ${c.instructorName} — ${MONTH_NAMES[c.month]} ${c.year}
DATE: ${new Date().toLocaleString()}

Dear HR Manager / Head of Department,

I would like to submit an after-hours overtime claim for the following session carried out beyond regular working hours:

  Instructor  : ${c.instructorName}
  Department  : ${c.dept}
  Date        : ${c.date} (${c.day})
  Time        : ${c.startTime} – ${c.endTime}
  Hours       : ${hrs} hour(s)
  Reason      : ${reason}

I kindly request that this claim be reviewed and processed accordingly.

Thank you.

Best regards,
${c.instructorName}
${c.dept}
SLIIT Kandy UNI
${PHONE}`;
}

// ══════════════════════════════════════════
//  JSON SAVE / LOAD
// ══════════════════════════════════════════
function saveJSON() {
  const data = getFormData(); if (!data) return;
  const existing = getClaims().filter(c => c.instructorId === currentUser.id);
  existing.push(data);
  const blob = new Blob([JSON.stringify(existing, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ot_claims_${currentUser.name.replace(/\s/g,'_')}.json`;
  a.click();
}

function loadJSON() { document.getElementById('jsonFileInput').click(); }

function onJSONFile(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const arr = JSON.parse(ev.target.result);
      const loaded = Array.isArray(arr) ? arr : [arr];
      const claims = getClaims(); let added = 0;
      loaded.forEach(c => { if (!claims.find(x => x.id===c.id)) { claims.push(c); added++; } });
      saveClaims(claims);
      showAlert('claimAlert', `✅ Loaded ${added} claim(s) from JSON.`, 'success');
      renderHistory();
    } catch { showAlert('claimAlert', '❌ Invalid JSON file.', 'warn'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ══════════════════════════════════════════
//  HISTORY
// ══════════════════════════════════════════
function renderHistory() {
  if (!currentUser) return;
  const fm = parseInt(document.getElementById('filterMonth').value);
  const fy = parseInt(document.getElementById('filterYear').value) || new Date().getFullYear();
  let claims = getClaims().filter(c => c.instructorId === currentUser.id);
  if (fm) claims = claims.filter(c => c.month===fm);
  if (fy) claims = claims.filter(c => c.year===fy);
  const totalHrs = claims.reduce((s,c) => s+calcHours(c.startTime,c.endTime), 0);
  const thisMonth = claims.filter(c => c.month===new Date().getMonth()+1 && c.year===new Date().getFullYear()).length;
  document.getElementById('statRow').innerHTML = `
    <div class="stat"><div class="stat-val">${claims.length}</div><div class="stat-label">Claims</div></div>
    <div class="stat"><div class="stat-val">${totalHrs.toFixed(1)}h</div><div class="stat-label">Total Hours</div></div>
    <div class="stat"><div class="stat-val">${thisMonth}</div><div class="stat-label">This Month</div></div>`;
  if (!claims.length) { document.getElementById('historyTable').innerHTML = '<p style="color:var(--muted);padding:12px">No claims found.</p>'; return; }
  document.getElementById('historyTable').innerHTML = `
    <table><thead><tr><th>Date</th><th>Day</th><th>Time</th><th>Hours</th><th>Reason</th><th>Module / Note</th><th>Status</th><th></th></tr></thead>
    <tbody>${claims.map(c => `<tr>
      <td>${c.date}</td><td>${c.day}</td>
      <td>${c.startTime}–${c.endTime}</td>
      <td>${calcHours(c.startTime,c.endTime).toFixed(1)}h</td>
      <td>${c.reason}</td>
      <td>${c.moduleCode||c.otherReason||'—'}</td>
      <td><span class="chip chip-${c.status==='Pending'?'pending':'approved'}">${c.status}</span></td>
      <td><button class="btn btn-danger btn-sm" onclick="deleteClaim('${c.id}')">🗑</button></td>
    </tr>`).join('')}</tbody></table>`;
}

document.addEventListener('change', e => { if (['filterMonth','filterYear'].includes(e.target.id)) renderHistory(); });

function deleteClaim(id) {
  if (!confirm('Delete this claim?')) return;
  saveClaims(getClaims().filter(c => c.id!==id));
  renderHistory();
}

function calcHours(s, e) {
  if (!s||!e) return 0;
  const [sh,sm] = s.split(':').map(Number), [eh,em] = e.split(':').map(Number);
  return Math.max(0, (eh*60+em-sh*60-sm)/60);
}

// ══════════════════════════════════════════
//  ADMIN — CLAIMS
// ══════════════════════════════════════════
function renderAdminClaims() {
  const fm = parseInt(document.getElementById('adminFilterMonth').value);
  const fd = document.getElementById('adminFilterDept').value;
  let claims = getClaims();
  if (fm) claims = claims.filter(c => c.month===fm);
  if (fd) claims = claims.filter(c => c.dept===fd);
  if (!claims.length) { document.getElementById('adminClaimsTable').innerHTML='<p style="color:var(--muted);padding:12px">No claims found.</p>'; return; }
  document.getElementById('adminClaimsTable').innerHTML = `
    <table><thead><tr><th>Instructor</th><th>Dept</th><th>Date</th><th>Time</th><th>Hrs</th><th>Reason</th><th>Status</th><th></th></tr></thead>
    <tbody>${claims.map(c=>`<tr>
      <td>${c.instructorName}</td>
      <td style="font-size:0.8rem">${c.dept.replace('Department of ','')}</td>
      <td>${c.date}</td><td>${c.startTime}–${c.endTime}</td>
      <td>${calcHours(c.startTime,c.endTime).toFixed(1)}</td>
      <td>${c.reason}${c.moduleCode?' ('+c.moduleCode+')':c.otherReason?' — '+c.otherReason:''}</td>
      <td><span class="chip chip-${c.status==='Pending'?'pending':'approved'}">${c.status}</span></td>
      <td><button class="btn btn-success btn-sm" onclick="approveClaim('${c.id}')">✓ Approve</button></td>
    </tr>`).join('')}</tbody></table>`;
}

function approveClaim(id) {
  const claims = getClaims(); const c = claims.find(x=>x.id===id);
  if (c) { c.status='Approved'; saveClaims(claims); renderAdminClaims(); }
}

function sendMonthlyReport() {
  const fm = parseInt(document.getElementById('adminFilterMonth').value) || new Date().getMonth()+1;
  const fd = document.getElementById('adminFilterDept').value;
  let claims = getClaims().filter(c=>c.month===fm);
  if (fd) claims = claims.filter(c=>c.dept===fd);
  const totalHrs = claims.reduce((s,c)=>s+calcHours(c.startTime,c.endTime),0);
  const byInstructor = {};
  claims.forEach(c => { if (!byInstructor[c.instructorName]) byInstructor[c.instructorName]={hrs:0,count:0}; byInstructor[c.instructorName].hrs+=calcHours(c.startTime,c.endTime); byInstructor[c.instructorName].count++; });
  const lines = Object.entries(byInstructor).map(([n,v])=>`  ${n.padEnd(32)} ${v.count} session(s)   ${v.hrs.toFixed(1)} hrs`).join('\n');
  showEmailPreview(`TO: ${HR_EMAIL}
SUBJECT: Monthly After-Hours Overtime Report — ${MONTH_NAMES[fm]} ${new Date().getFullYear()}${fd?' — '+fd:''}
DATE: ${new Date().toLocaleString()}

Monthly After-Hours Overtime Summary
══════════════════════════════════════
Institution  : SLIIT Kandy UNI
Period       : ${MONTH_NAMES[fm]} ${new Date().getFullYear()}
Department   : ${fd || 'All Departments'}
Total Claims : ${claims.length}
Total Hours  : ${totalHrs.toFixed(1)} hrs

Breakdown by Instructor:
──────────────────────────────────────
${lines || '  No claims.'}

Detailed Claims:
──────────────────────────────────────
${claims.map(c=>`  ${c.date} ${c.day} | ${c.instructorName} | ${c.startTime}–${c.endTime} | ${c.reason}${c.moduleCode?' ('+c.moduleCode+')':c.otherReason?' — '+c.otherReason:''}`).join('\n')}

Generated by SLIIT Kandy UNI — After-Hours Overtime Claim System
Kengolla, Kundasale, Kandy | ${PHONE}`);
}

// ══════════════════════════════════════════
//  ADMIN — INSTRUCTORS
// ══════════════════════════════════════════
function addInstructor() {
  const name  = document.getElementById('newName').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  const dept  = document.getElementById('newDept').value;
  if (!name||!email) { alert('Please fill in name and email'); return; }
  const instructors = getInstructors();
  instructors.push({ id:'i'+Date.now(), name, email, dept, role:'instructor' });
  saveInstructors(instructors);
  document.getElementById('newName').value=''; document.getElementById('newEmail').value='';
  renderInstructorList(); populateLoginUsers();
}

function removeInstructor(id) {
  if (!confirm('Remove this instructor?')) return;
  saveInstructors(getInstructors().filter(u=>u.id!==id));
  renderInstructorList(); populateLoginUsers();
}

function renderInstructorList() {
  const instructors = getInstructors();
  const computing = instructors.filter(u=>u.dept==='Department of Computing');
  const business  = instructors.filter(u=>u.dept==='Department of Business Management');
  const tbl = arr => arr.length ? `
    <table><thead><tr><th>Name</th><th>Email</th><th></th></tr></thead>
    <tbody>${arr.map(u=>`<tr><td>${u.name}</td><td>${u.email}</td>
      <td><button class="btn btn-danger btn-sm" onclick="removeInstructor('${u.id}')">Remove</button></td></tr>`).join('')}
    </tbody></table>` : '<p style="color:var(--muted);font-size:0.9rem">No instructors.</p>';
  document.getElementById('instructorList').innerHTML = `
    <p style="font-weight:700;color:var(--primary);margin-bottom:8px">🖥️ Department of Computing (${computing.length})</p>
    ${tbl(computing)}
    <p style="font-weight:700;color:var(--primary);margin:16px 0 8px">📊 Department of Business Management (${business.length})</p>
    ${tbl(business)}`;
}

// ══════════════════════════════════════════
//  MODAL / ALERTS
// ══════════════════════════════════════════
function showEmailPreview(text) { document.getElementById('emailPreview').textContent=text; document.getElementById('emailModal').classList.add('open'); }
function closeModal() { document.getElementById('emailModal').classList.remove('open'); }
function copyEmail() { navigator.clipboard.writeText(document.getElementById('emailPreview').textContent).then(()=>alert('Copied to clipboard!')); }
function showAlert(id, msg, type) { const el=document.getElementById(id); el.className=`alert alert-${type}`; el.innerHTML=msg; el.style.display='flex'; }

// ══════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════
(function init() {
  populateLoginUsers();
  const y = new Date().getFullYear();
  ['claimYear','filterYear'].forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    for (let i=y; i>=y-2; i--) el.innerHTML += `<option value="${i}">${i}</option>`;
  });
  document.getElementById('claimMonth').value  = new Date().getMonth()+1;
  document.getElementById('filterMonth').value = new Date().getMonth()+1;
  document.getElementById('claimDate').valueAsDate = new Date();
})();
</script>
